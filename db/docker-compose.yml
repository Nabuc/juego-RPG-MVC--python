version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: rpg_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tu_password
      MYSQL_DATABASE: rpg_manager
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: rpg_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mariadb_data:
  mongodb_data:
